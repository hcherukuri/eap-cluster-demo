---
- name: Fix AAP Localhost Sudo Issue
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Disable privilege escalation for localhost
      ansible.builtin.add_host:
        name: localhost
        ansible_become: false
        ansible_connection: local

- name: Install and configure EAP cluster
  hosts: all:!localhost
  become: true
  collections:
    - redhat.eap
  vars_files:
    - vars.yml
  pre_tasks:
    - name: Build cluster node list for JGroups TCP PING
      ansible.builtin.include_tasks: tasks/cluster_nodes.yml
  roles:
    - eap_install
    - eap_systemd
  tasks:
    - name: Report installed EAP version
      ansible.builtin.include_tasks: tasks/eap_version.yml
      vars:
        eap_version_message: running

- name: Verify EAP installation
  ansible.builtin.import_playbook: validate.yml

- name: Deploy JBoss EAP
  hosts: all:!localhost
  become: true
  collections:
    - redhat.eap
  vars_files:
    - vars.yml
  vars:
    eap_app_deployment_file: "/tmp/{{ app.name }}"
    eap_app_deploy_name: "{{ app.name }}"
    jboss_cli_controller_host: "127.0.0.1"
    jboss_cli_controller_port: "9990"
    eap_apps_jboss_cli_deploy_force: true
  pre_tasks:
    - name: Download demo app on controller
      ansible.builtin.get_url:
        url: "{{ app.url }}"
        dest: "/tmp/{{ app.name }}"
        mode: "0644"
      delegate_to: localhost
      run_once: true
      become: false
  roles:
    - eap_app_deploy
