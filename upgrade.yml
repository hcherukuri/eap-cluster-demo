---
- name: Upgrade EAP
  hosts: all:!localhost
  become: true
  collections:
    - redhat.eap
  vars_files:
    - vars.yml
    - upgrade-vars.yml
  pre_tasks:
    - name: Build cluster node list for JGroups TCP PING
      ansible.builtin.include_tasks: tasks/cluster_nodes.yml

    - name: Stop EAP before upgrade
      ansible.builtin.service:
        name: "{{ eap_service_name | default('eap') }}"
        state: stopped

  roles:
    - eap_install
    - eap_migration
    - eap_systemd
  tasks:
    - name: Restart eap service
      ansible.builtin.service:
        name: "{{ eap_service_name | default('eap') }}"
        state: restarted

    - name: Report upgraded EAP version
      ansible.builtin.include_tasks: tasks/eap_version.yml
      vars:
        eap_version_message: upgraded to

- name: Verify upgraded EAP
  hosts: all:!localhost
  become: true
  collections:
    - redhat.eap
  vars_files:
    - vars.yml
    - upgrade-vars.yml
  roles:
    - eap_validation
